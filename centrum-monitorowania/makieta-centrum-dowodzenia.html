<title>Centrum Dowodzenia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sidebar „konsola” + panel główny; karta wątku wysuwa się z prawej jak panel instrumentów */
:root{
  --bg:#F3F5F9; --panel:#FFFFFF; --panel-2:#EAEEF5; --line:#D9DFEA;
  --ink:#16203A; --ink-2:#4A5672; --ink-3:#7A859E;
  --accent:#0B7A85; --accent-ink:#FFFFFF; --accent-soft:#DDF1F2;
  --ok:#2F7D4F; --ok-soft:#E1F1E7; --warn:#A86A00; --warn-soft:#FBEFD6;
  --crit:#B3261E; --crit-soft:#F9E1DE; --wait:#5B4FB0; --wait-soft:#E9E6F7;
  --stars:none; --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.08);
  --f-hud:"Chakra Petch","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0F1E; --panel:#121A2D; --panel-2:#1A2440; --line:#26314F;
  --ink:#E7ECF6; --ink-2:#AAB5CE; --ink-3:#7381A2;
  --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#123A3E;
  --ok:#6FCF97; --ok-soft:#14321F; --warn:#F2C14E; --warn-soft:#3A2E10;
  --crit:#FF7A6E; --crit-soft:#3D1715; --wait:#A99BFF; --wait-soft:#241F45;
  --stars:radial-gradient(1px 1px at 12% 18%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 68% 9%,#ffffff40 50%,transparent 51%),radial-gradient(1.5px 1.5px at 84% 42%,#ffffff35 50%,transparent 51%),radial-gradient(1px 1px at 33% 71%,#ffffff40 50%,transparent 51%),radial-gradient(1px 1px at 52% 38%,#ffffff2a 50%,transparent 51%),radial-gradient(1px 1px at 91% 83%,#ffffff40 50%,transparent 51%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F1E; --panel:#121A2D; --panel-2:#1A2440; --line:#26314F;
  --ink:#E7ECF6; --ink-2:#AAB5CE; --ink-3:#7381A2;
  --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#123A3E;
  --ok:#6FCF97; --ok-soft:#14321F; --warn:#F2C14E; --warn-soft:#3A2E10;
  --crit:#FF7A6E; --crit-soft:#3D1715; --wait:#A99BFF; --wait-soft:#241F45;
  --stars:radial-gradient(1px 1px at 12% 18%,#ffffff55 50%,transparent 51%),radial-gradient(1px 1px at 68% 9%,#ffffff40 50%,transparent 51%),radial-gradient(1.5px 1.5px at 84% 42%,#ffffff35 50%,transparent 51%),radial-gradient(1px 1px at 33% 71%,#ffffff40 50%,transparent 51%),radial-gradient(1px 1px at 52% 38%,#ffffff2a 50%,transparent 51%),radial-gradient(1px 1px at 91% 83%,#ffffff40 50%,transparent 51%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--stars),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--f-hud);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;line-height:1.15;display:block}
.brand small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.04em}
.radar{width:34px;height:34px;flex:none}
.radar .sweep{transform-origin:17px 17px;animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.radar .sweep{animation:none}}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-family:var(--f-hud);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:4px 10px}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;border:0;background:none;text-align:left;color:var(--ink-2);width:100%}
.nav:hover{background:var(--panel-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.nav .cnt.hot{color:var(--crit)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:0 8px}
/* main */
.main{min-width:0;padding-block:18px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:22px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--ink-3)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 10px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink);font-weight:600}
.eyebrow{font-family:var(--f-hud);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-hud);font-weight:600;font-size:28px;letter-spacing:.01em;margin:4px 0 4px;text-wrap:balance}
h2{font-family:var(--f-hud);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0;display:flex;align-items:center;gap:8px}
h2 .n{font-family:var(--f-mono);letter-spacing:0;color:var(--ink-3);font-weight:400}
.sub{color:var(--ink-2);margin:0 0 20px;max-width:70ch}
.demo{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);margin-left:8px;vertical-align:middle}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-family:var(--f-hud);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--ink-2)}
.stat.crit .v{color:var(--crit)} .stat.warn .v{color:var(--warn)} .stat.wait .v{color:var(--wait)}
/* horizon */
.hz{display:flex;flex-direction:column;gap:6px}
.hzhead{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.hzhead:first-child{margin-top:0}
.hzhead .bar{height:1px;flex:1;background:var(--line)}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.row:hover{background:var(--panel-2)}
.row .t{min-width:0}
.row .t .title{font-weight:500}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--ink-3)}
.row.done .title{text-decoration:line-through;color:var(--ink-3)}
.when{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.when.late{color:var(--crit);font-weight:500}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:5px;margin:2px 0 0;display:grid;place-content:center;background:var(--panel)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:6px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.chip .dot{width:7px;height:7px}
.who{font-size:12px;color:var(--ink-2)}
.prio{width:7px;height:7px;border-radius:50%;display:inline-block}
.prio.p1{background:var(--crit)} .prio.p2{background:var(--warn)} .prio.p3{background:var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-toku{background:var(--accent-soft);color:var(--accent)}
.s-klient{background:var(--wait-soft);color:var(--wait)}
.s-zespol{background:var(--warn-soft);color:var(--warn)}
.s-zrobic{background:var(--panel-2);color:var(--ink-2)}
.s-wstrz{background:var(--panel-2);color:var(--ink-3)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-analiza{background:var(--accent-soft);color:var(--accent)}
/* waiting */
.wait{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.wait:last-child{border-bottom:0}
.wait .who2{font-weight:600}
.wait .what{grid-column:1/2;font-size:12.5px;color:var(--ink-2)}
.age{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;align-self:start;font-variant-numeric:tabular-nums}
.age.a1{background:var(--ok-soft);color:var(--ok)} .age.a2{background:var(--warn-soft);color:var(--warn)} .age.a3{background:var(--crit-soft);color:var(--crit)}
.lost{padding:10px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.lost:last-child{border-bottom:0}
.lost .why{font-size:12px;color:var(--crit)}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-align:left}
.linkish:hover{color:var(--accent)}
/* client */
.clienthead{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--ink-2);margin:6px 0 18px}
.facts b{font-weight:600;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%}
.card:hover{border-color:var(--ink-3);box-shadow:var(--shadow)}
.card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .code{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.card .name{font-weight:600;font-size:15px;line-height:1.3}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:12.5px}
.kv dt{font-family:var(--f-hud);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.kv dd{margin:0;color:var(--ink-2)}
.upd{background:var(--panel-2);border-radius:10px;padding:9px 11px;font-size:12.5px;color:var(--ink-2)}
.upd .d{font-family:var(--f-mono);font-size:11px;color:var(--accent);display:block;margin-bottom:2px}
.card .foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:auto}
.prog{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono)}
.prog i{display:block;width:54px;height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden}
.prog i b{display:block;height:100%;background:var(--accent)}
.project{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.project .phead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.ptag{font-family:var(--f-hud);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.project .pname{font-family:var(--f-hud);font-size:19px;font-weight:600}
.pgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.mini{display:flex;flex-direction:column;gap:6px}
.minirow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;text-align:left}
.minirow:hover{border-color:var(--ink-3)}
.minirow .nm{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.section{margin-top:26px}
.section > h2{margin-bottom:10px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.list{display:flex;flex-direction:column}
.list .li{display:flex;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
.list .li:last-child{border-bottom:0}
.list .li .x{flex:1;min-width:0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--ink-2)}
/* timeline (kluczowe daty) */
.tl{display:flex;gap:0;overflow-x:auto;padding:6px 2px 4px}
.tl .ev{flex:0 0 150px;position:relative;padding:18px 10px 0 0;border-top:2px solid var(--line)}
.tl .ev::before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.tl .ev.crit::before{background:var(--crit)}
.tl .ev .d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.tl .ev .x{font-size:12.5px;font-weight:500}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.38);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:31;overflow:auto;box-shadow:var(--shadow);padding:20px max(22px,env(safe-area-inset-right,0px)) 40px 22px;padding-top:max(20px,env(safe-area-inset-top,0px))}
.drawer .close{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px}
.drawer h3{font-family:var(--f-hud);font-size:22px;margin:4px 40px 8px 0;font-weight:600}
.dsec{margin-top:20px}
.dsec > h2{margin-bottom:8px}
.lastbox{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.lastbox .d{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}
.lastbox p{margin:4px 0 0}
.addupd{display:flex;flex-direction:column;gap:8px;margin-top:10px}
textarea,input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:76px;resize:vertical}
.formrow{display:flex;flex-wrap:wrap;gap:8px}
.formrow > *{flex:1 1 160px}
.arch{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:12px}
.arch .e{position:relative}
.arch .e::before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--ink-3)}
.arch .e .d{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.arch .e p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.sumbtn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-hud);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.links a:hover{border-color:var(--accent)}
/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.modal pre{font-family:var(--f-mono);font-size:12px}
.diff{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.diff .dl{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:7px 10px;border-radius:9px;background:var(--panel-2)}
.diff .dl b{font-family:var(--f-mono);font-size:11px;min-width:84px}
.diff .add b{color:var(--ok)} .diff .done b{color:var(--accent)} .diff .chg b{color:var(--warn)} .diff .arc b{color:var(--ink-3)}
/* table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-hud);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--panel-2)}
td.num{font-family:var(--f-mono);text-align:center;font-variant-numeric:tabular-nums}
td.num.hi{color:var(--accent);font-weight:600}
tr:last-child td{border-bottom:0}
.rule{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.tpl{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;margin:8px 0}
.krys{white-space:pre-wrap;font-family:var(--f-body);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:13.5px;line-height:1.6}
/* toast / notif */
.notif{position:fixed;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;z-index:50;display:flex;gap:11px}
.notif .ic{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.notif .tt{font-weight:600;font-size:13px}
.notif .bd{font-size:12.5px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:60;font-size:13px}
.settings{display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px}
.toggle input{margin-top:3px;accent-color:var(--accent)}
.toggle small{display:block;color:var(--ink-3)}
@media (max-width:980px){.grid2,.pgrid,.cols3{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

  const a=e.target.closest('[data-add]'); if(a){openQuick(a.dataset.client); setTimeout(()=>{const s=document.getElementById('qKind'); if(s) s.value=a.dataset.add==='project'?'Nowy projekt':'Nowy wątek'},0); return}
  const c=e.target.closest('[data-copy]'); if(c){const el=document.getElementById(c.dataset.copy);const txt=el.value!==undefined&&el.tagName==='TEXTAREA'?el.value:el.textContent;
    const ok=()=>toast('Skopiowano'); const fb=()=>{try{const r=document.createRange();if(el.select)el.select();else{r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Zaznaczono — naciśnij ⌘C')}catch(_){}};
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(_){fb()} return}
  const t=e.target.closest('[data-toast]'); if(t){toast(t.dataset.toast); return}
  const th=e.target.closest('[data-th]'); if(th){state.theme=th.dataset.th;try{localStorage.setItem('cd-theme',state.theme)}catch(_){}applyTheme();refresh();return}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.k; if(k!=null&&REFS[+k]){REFS[+k].done=e.target.checked; const open=document.querySelector('.drawer'); const id=open&&open.querySelector('.eyebrow').textContent.split('·')[1]; refresh(); if(open&&id) openDrawer(id.trim()); if(e.target.checked) toast('Zrobione ✓')}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeLayer();
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('q').focus()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openQuick()}
});
document.getElementById('q').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.toLowerCase().trim();if(!q)return;const hit=[...PROJECTS,...THREADS].find(t=>(t.id+' '+t.name+' '+(t.ref||'')+' '+t.ball).toLowerCase().includes(q));if(hit)openDrawer(hit.id);else toast('Brak wyników dla „'+e.target.value+'”')});
document.getElementById('btnPaste').onclick=openPaste;
document.getElementById('btnQuick').onclick=()=>openQuick();
document.getElementById('btnSettings').onclick=openSettings;
applyTheme(); refresh();
setTimeout(()=>notif('Centrum Dowodzenia · 8:45','3 zaległe · 6 na dziś · 4 wątki bez sygnału'),900);
})();
</script>
